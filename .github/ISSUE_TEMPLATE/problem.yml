name: App problem
description: Report a reproducible gameplay, purchase, performance, or UI problem.
title: "[Problem] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Do not include your Apple ID, full order number, payment details, address, or phone number.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Gameplay
        - Purchase or restore
        - Performance
        - Controls or haptics
        - Story or text
        - Visual or UI
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 13, iOS 26.5
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the stage, ship, weapon, and the exact sequence that triggers the issue.
      placeholder: |
        1. Select Stage ...
        2. Choose ship ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include private account, payment, order, address, or phone information.
          required: true
